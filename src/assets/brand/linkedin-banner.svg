<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C1A2B"/>
      <stop offset="55%" stop-color="#0E2137"/>
      <stop offset="100%" stop-color="#0A1522"/>
    </linearGradient>

    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#31B0E6" stop-opacity="0"/>
      <stop offset="70%" stop-color="#31B0E6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#31B0E6" stop-opacity="1"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1584" height="396" fill="url(#panel)"/>

  <!-- structural rule: divides the avatar zone from the identity block -->
  <rect x="440" y="104" width="3" height="168" fill="#F5B335"/>

  <g font-family="DejaVu Sans Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">

    <text x="478" y="136" font-size="15" letter-spacing="5.5" font-weight="bold"
          fill="#31B0E6">FULL STACK SOFTWARE ENGINEER</text>

    <text x="478" y="196" font-size="46" letter-spacing="1" font-weight="bold"
          fill="#F2F7FB">Edmel John Linaugo<tspan fill="#F5B335">_</tspan></text>

    <text x="478" y="236" font-size="19" letter-spacing="0.6" fill="#9FB8CE">TypeScript<tspan
      fill="#F5B335"> · </tspan>Node.js<tspan fill="#F5B335"> · </tspan>React<tspan
      fill="#F5B335"> · </tspan>PostgreSQL<tspan fill="#F5B335"> · </tspan>AWS</text>

    <text x="478" y="266" font-size="15.5" fill="#5F7C97">AI-powered features in production · React Native · Docker · Fargate</text>

    <text x="1166.7" y="136" font-size="13" letter-spacing="3" fill="#5F7C97">ILOILO,&#160;PH</text>
    <text x="1275.0" y="136" font-size="13" letter-spacing="3" fill="#F5B335">&#160;//&#160;</text>
    <text x="1318.3" y="136" font-size="13" letter-spacing="3" fill="#5F7C97">GITHUB.COM/EDMELKUN</text>

    <!-- the round trip, frozen mid-flight -->
    <line x1="478" y1="300" x2="1500" y2="300" stroke="#1E3A55" stroke-width="2.5"/>
    <line x1="600" y1="300" x2="1010" y2="300" stroke="url(#trail)" stroke-width="3"
          stroke-linecap="round" filter="url(#glow)"/>

    <circle cx="478"  cy="300" r="5" fill="#1E3A55"/>
    <circle cx="989"  cy="300" r="6" fill="#31B0E6" filter="url(#glow)"/>
    <circle cx="1500" cy="300" r="5" fill="#1E3A55"/>

    <text x="478"  y="328" font-size="12" letter-spacing="3.4" font-weight="bold" fill="#5F7C97">CLIENT</text>
    <text x="989"  y="328" font-size="12" letter-spacing="3.4" font-weight="bold" fill="#31B0E6" text-anchor="middle">API</text>
    <text x="1500" y="328" font-size="12" letter-spacing="3.4" font-weight="bold" fill="#5F7C97" text-anchor="end">DATA</text>
  </g>
</svg>
