<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Edmel John Linaugo — Full Stack Software Engineer">
  <title>Edmel John Linaugo — Full Stack Software Engineer</title>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C1A2B"/>
      <stop offset="55%" stop-color="#0E2137"/>
      <stop offset="100%" stop-color="#0A1522"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <path id="route" d="M 520 86 H 840 V 138 H 536 V 190 H 856" fill="none"/>
  </defs>

  <style>
    :root { --cyan:#31B0E6; --amber:#F5B335; --paper:#F2F7FB; --muted:#7E9AB5; }

    .mono {
      font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas,
                   "DejaVu Sans Mono", "Liberation Mono", monospace;
    }
    .eyebrow { font-size:10.5px; letter-spacing:3.6px; fill:#31B0E6; font-weight:600; }
    .name    { font-size:31px; letter-spacing:0.4px; fill:#F2F7FB; font-weight:700; }
    .stack   { font-size:12.5px; letter-spacing:0.6px; fill:#9FB8CE; }
    .sep     { fill:#F5B335; }
    .note    { font-size:11px; letter-spacing:0.3px; fill:#5F7C97; }
    .meta    { font-size:10px; letter-spacing:2.4px; fill:#5F7C97; }
    .rail-label { font-size:9px; letter-spacing:2.6px; fill:#5F7C97; font-weight:600; }

    .rail  { stroke:#1E3A55; stroke-width:2; fill:none; }
    .pip   { fill:#1E3A55; }

    .pulse {
      fill:none; stroke-width:2.6; stroke-linecap:round;
      stroke-dasharray:64 1100; filter:url(#glow);
    }
    .pulse--req { stroke:#31B0E6; animation:req 6.4s linear infinite; }
    .pulse--res { stroke:#F5B335; animation:res 6.4s linear infinite; }

    @keyframes req {
      0%   { stroke-dashoffset:64;    opacity:0; }
      3%   { opacity:1; }
      40%  { stroke-dashoffset:-1100; opacity:1; }
      45%  { stroke-dashoffset:-1100; opacity:0; }
      100% { stroke-dashoffset:-1100; opacity:0; }
    }
    @keyframes res {
      0%   { stroke-dashoffset:-1100; opacity:0; }
      50%  { stroke-dashoffset:-1100; opacity:0; }
      53%  { opacity:1; }
      90%  { stroke-dashoffset:64;    opacity:1; }
      95%  { stroke-dashoffset:64;    opacity:0; }
      100% { stroke-dashoffset:64;    opacity:0; }
    }

    .caret { fill:#F5B335; font-weight:700; animation:blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%,50% { opacity:1; } 50.01%,100% { opacity:0; } }

    .node { animation:ping 6.4s ease-out infinite; transform-box:fill-box; transform-origin:center; }
    .node--1 { animation-delay:0.15s; }
    .node--2 { animation-delay:1.05s; }
    .node--3 { animation-delay:1.95s; }
    .node--4 { animation-delay:2.55s; }
    @keyframes ping {
      0%,100% { fill:#1E3A55; }
      6%      { fill:#31B0E6; }
      22%     { fill:#1E3A55; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pulse, .caret, .node { animation:none; }
      .pulse--req { opacity:1; stroke-dashoffset:-540; }
      .pulse--res { opacity:0; }
      .caret { opacity:1; }
    }
  </style>

  <rect width="900" height="250" rx="16" fill="url(#panel)"/>
  <rect x="0.75" y="0.75" width="898.5" height="248.5" rx="15.5"
        fill="none" stroke="#31B0E6" stroke-opacity="0.16"/>

  <!-- identity -->
  <g class="mono">
    <text class="eyebrow" x="44" y="60">FULL STACK SOFTWARE ENGINEER</text>
    <text class="name"    x="44" y="106">Edmel John Linaugo<tspan class="caret">_</tspan></text>

    <text class="stack" x="44" y="137">TypeScript<tspan class="sep"> · </tspan>Node.js<tspan class="sep"> · </tspan>React<tspan class="sep"> · </tspan>PostgreSQL<tspan class="sep"> · </tspan>AWS</text>
    <text class="note"  x="44" y="160">AI-powered features in production · React Native · Docker · Fargate</text>

    <text class="meta" x="44" y="212">ILOILO, PH<tspan fill="#F5B335"> // </tspan>GITHUB.COM/EDMELKUN</text>
  </g>

  <!-- signature: one request through the stack, one response back -->
  <g class="mono">
    <text class="rail-label" x="520" y="74">CLIENT</text>
    <text class="rail-label" x="840" y="126" text-anchor="end">API</text>
    <text class="rail-label" x="536" y="178">DATA</text>
  </g>

  <use href="#route" class="rail"/>
  <use href="#route" class="pulse pulse--req"/>
  <use href="#route" class="pulse pulse--res"/>

  <circle class="pip node node--1" cx="840" cy="86"  r="4"/>
  <circle class="pip node node--2" cx="840" cy="138" r="4"/>
  <circle class="pip node node--3" cx="536" cy="138" r="4"/>
  <circle class="pip node node--4" cx="536" cy="190" r="4"/>
  <circle class="pip" cx="520" cy="86"  r="3"/>
  <circle class="pip" cx="856" cy="190" r="3"/>
</svg>
